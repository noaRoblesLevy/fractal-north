<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img"
     aria-label="Backtest equity curve rising smoothly while the live curve stays flat and noisy.">
  <style>
    .axis { stroke: #6B7A9C; stroke-opacity: 0.5; stroke-width: 1; }
    .grid { stroke: #6B7A9C; stroke-opacity: 0.16; stroke-width: 1; }
    .lbl  { fill: #7E8CA8; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; }
    .lbl-sm { fill: #7E8CA8; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; }
    .bt   { fill: none; stroke: #4C86FF; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .live { fill: none; stroke: #1F4FE0; stroke-width: 2; stroke-linecap: round; stroke-opacity: 0.85; }
    .split { stroke: #6B7A9C; stroke-opacity: 0.4; stroke-width: 1; stroke-dasharray: 4 5; }
  </style>

  <!-- grid -->
  <g class="grid">
    <line x1="70" y1="70" x2="820" y2="70"/>
    <line x1="70" y1="140" x2="820" y2="140"/>
    <line x1="70" y1="210" x2="820" y2="210"/>
    <line x1="70" y1="280" x2="820" y2="280"/>
  </g>
  <!-- axes -->
  <line class="axis" x1="70" y1="40" x2="70" y2="310"/>
  <line class="axis" x1="70" y1="310" x2="820" y2="310"/>

  <!-- out-of-sample split -->
  <line class="split" x1="505" y1="40" x2="505" y2="310"/>
  <text class="lbl-sm" x="512" y="56">out of sample</text>

  <!-- backtest curve: smooth rise -->
  <path class="bt" d="M70 300 C 160 292, 250 250, 340 205 S 470 120, 505 96
                      C 590 70, 700 60, 820 52"/>
  <!-- live curve: flat, noisy (begins at the split) -->
  <path class="live" d="M505 96 L 525 120 L 545 108 L 565 134 L 585 112 L 605 140
                        L 625 118 L 645 150 L 665 126 L 685 152 L 705 122 L 725 148
                        L 745 130 L 765 156 L 785 128 L 805 150 L 820 136"/>

  <!-- legend -->
  <g>
    <line class="bt" x1="96" y1="340" x2="126" y2="340"/>
    <text class="lbl" x="134" y="345">Backtest</text>
    <line class="live" x1="246" y1="340" x2="276" y2="340"/>
    <text class="lbl" x="284" y="345">Live</text>
  </g>

  <text class="lbl-sm" x="70" y="332">time</text>
  <text class="lbl-sm" x="20" y="48" transform="rotate(-90 20 48)">equity</text>
</svg>
