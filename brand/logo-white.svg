  </g>
  <circle cx="50" cy="50" r="4.1" fill="#FFFFFF" fill-opacity="0.001"/>
  <circle cx="50" cy="50" r="3.4" fill="none" stroke="#FFFFFF" stroke-width="1.1"/>
</svg>
